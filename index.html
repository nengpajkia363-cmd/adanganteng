<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk Kamu ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hujan hati -->
    <div id="hearts"></div>

    <main class="container">

        <div class="card">

            <div class="heart">❤️</div>

            <h1>Hai, Kamu 💌</h1>

            <p class="subtitle">
                Aku punya sesuatu yang mau aku sampaikan...
            </p>

            <button id="openButton">
                Buka Pesannya 💖
            </button>

            <div id="message" class="hidden">

                <h2>Untuk Kamu 🌷</h2>

                <p>
                    Terima kasih sudah menjadi seseorang
                    yang begitu berarti.
                </p>

                <p>
                    Semoga hari kamu selalu dipenuhi
                    hal-hal baik dan senyuman. ✨
                </p>

                <div class="big-heart">
                    ❤️
                </div>

                <p class="closing">
                    — Dari seseorang yang ingin membuatmu tersenyum —
                </p>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
